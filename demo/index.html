<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatGPT</title>
    <style>
      :root {
        --bg-main: #212121;
        --bg-sidebar: #171717;
        --bg-user-row: #303030;
        --bg-composer: #303030;
        --bg-hover: #2a2a2a;
        --text-primary: #ececec;
        --text-secondary: #b4b4b4;
        --text-muted: #8e8e8e;
        --border: #424242;
        --border-subtle: #333;
        --accent: #00a86b;
        --accent-soft: rgba(0, 168, 107, 0.14);
        --status-review: #d97706;
        --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: var(--font);
        background: var(--bg-main);
        color: var(--text-primary);
        height: 100vh;
        overflow: hidden;
      }

      .app {
        display: grid;
        grid-template-columns: 260px 1fr;
        height: 100vh;
      }

      .sidebar {
        background: var(--bg-sidebar);
        border-right: 1px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        padding: 8px;
      }

      .sidebar-top {
        padding: 8px 4px 12px;
      }

      .sidebar-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        font-size: 15px;
        font-weight: 600;
      }

      .sidebar-logo svg { width: 22px; height: 22px; }

      .new-chat {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 10px 12px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--text-primary);
        font-size: 14px;
        cursor: pointer;
        font-family: inherit;
        margin-top: 4px;
      }

      .new-chat:hover { background: var(--bg-hover); }

      .chat-history { flex: 1; overflow: auto; padding: 4px; }

      .history-item {
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 14px;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: default;
      }

      .history-item.active {
        background: var(--bg-hover);
        color: var(--text-primary);
      }

      .sidebar-footer {
        padding: 12px;
        font-size: 11px;
        color: var(--text-muted);
        border-top: 1px solid var(--border-subtle);
      }

      .main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        height: 100vh;
        background: var(--bg-main);
      }

      .topbar {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 10px 16px;
        min-height: 52px;
      }

      .model-picker {
        grid-column: 2;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 500;
        cursor: default;
      }

      .model-picker:hover { background: var(--bg-hover); }

      .topbar-actions {
        grid-column: 3;
        justify-self: end;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .connector-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 8px;
        border-radius: 6px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 11px;
        font-weight: 500;
      }

      .connector-badge.hidden { display: none; }

      .connector-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent);
      }

      .demo-btn {
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-secondary);
        font-size: 12px;
        cursor: pointer;
        font-family: inherit;
      }

      .demo-btn:hover { background: var(--bg-hover); color: var(--text-primary); }

      .chat-area {
        flex: 1;
        overflow-y: auto;
        scroll-behavior: smooth;
      }

      .message-row {
        width: 100%;
        opacity: 0;
        animation: fadeIn 0.3s ease forwards;
      }

      .message-row.user { background: var(--bg-user-row); }

      @keyframes fadeIn { to { opacity: 1; } }

      .message-inner {
        max-width: 46rem;
        margin: 0 auto;
        padding: 20px 24px;
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }

      .message-row.user .message-inner {
        justify-content: flex-end;
      }

      .message-row.user .message-content {
        text-align: right;
        max-width: 85%;
      }

      .avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .avatar.assistant {
        background: transparent;
        color: var(--text-primary);
      }

      .avatar.assistant svg { width: 28px; height: 28px; }

      .avatar.user {
        background: #5c5c5c;
        color: #fff;
        font-size: 11px;
        font-weight: 600;
      }

      .message-content { flex: 1; min-width: 0; }

      .message-text {
        font-size: 16px;
        line-height: 1.7;
        color: var(--text-primary);
        white-space: pre-wrap;
      }

      .tool-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 12px;
        padding: 6px 10px;
        border-radius: 8px;
        background: var(--bg-main);
        border: 1px solid var(--border);
        font-size: 13px;
        color: var(--text-secondary);
      }

      .tool-chip svg { width: 14px; height: 14px; opacity: 0.7; }

      .typing {
        display: flex;
        gap: 5px;
        padding: 6px 0;
      }

      .typing span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-muted);
        animation: bounce 1.2s infinite;
      }

      .typing span:nth-child(2) { animation-delay: 0.15s; }
      .typing span:nth-child(3) { animation-delay: 0.3s; }

      @keyframes bounce {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
        30% { transform: translateY(-4px); opacity: 1; }
      }

      .widget {
        margin-top: 16px;
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        background: var(--bg-main);
        max-width: 100%;
      }

      .widget-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 18px;
        border-bottom: 1px solid var(--border-subtle);
      }

      .widget-title { font-size: 14px; font-weight: 600; }

      .widget-brand {
        font-size: 11px;
        font-weight: 600;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .widget-body { padding: 18px; }

      .field-grid { display: grid; gap: 14px; }

      .field { display: flex; flex-direction: column; gap: 3px; }

      .field-label {
        font-size: 11px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .field-value { font-size: 14px; }
      .field-value.amount { font-size: 20px; font-weight: 600; color: var(--accent); }

      .widget-actions {
        display: flex;
        gap: 8px;
        padding: 14px 18px;
        border-top: 1px solid var(--border-subtle);
      }

      .widget-btn {
        flex: 1;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg-composer);
        color: var(--text-primary);
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
      }

      .widget-btn:hover { background: var(--bg-hover); }

      .widget-btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .status-tracker {
        display: flex;
        align-items: center;
        margin-top: 8px;
      }

      .status-step {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        position: relative;
      }

      .status-step:not(:last-child)::after {
        content: "";
        position: absolute;
        top: 10px;
        left: 50%;
        width: 100%;
        height: 2px;
        background: var(--border);
        z-index: 0;
      }

      .status-step.done:not(:last-child)::after,
      .status-step.active:not(:last-child)::after { background: var(--accent); }

      .status-dot {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid var(--border);
        background: var(--bg-main);
        position: relative;
        z-index: 1;
      }

      .status-step.done .status-dot { border-color: var(--accent); background: var(--accent); }
      .status-step.active .status-dot { border-color: var(--status-review); background: var(--status-review); }

      .status-label {
        font-size: 10px;
        color: var(--text-muted);
        text-align: center;
        max-width: 72px;
      }

      .status-step.done .status-label,
      .status-step.active .status-label { color: var(--text-secondary); }

      .ref-pill {
        display: inline-flex;
        padding: 6px 12px;
        border-radius: 8px;
        background: var(--bg-composer);
        font-size: 14px;
        font-weight: 600;
        margin-top: 6px;
      }

      .upload-zone {
        margin-top: 14px;
        padding: 28px 20px;
        border: 1px dashed var(--border);
        border-radius: 12px;
        text-align: center;
        color: var(--text-muted);
        font-size: 13px;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
      }

      .upload-zone:hover,
      .upload-zone.dragover {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--text-secondary);
      }

      .upload-zone.uploading { pointer-events: none; opacity: 0.7; }

      .upload-icon {
        display: block;
        margin: 0 auto 8px;
        width: 24px;
        height: 24px;
        opacity: 0.5;
      }

      .file-list {
        margin-top: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .file-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--bg-composer);
        font-size: 13px;
      }

      .file-item svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--accent); }

      .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .file-size { color: var(--text-muted); font-size: 12px; }

      .email-widget .email-meta {
        display: grid;
        gap: 6px;
        padding-bottom: 14px;
        margin-bottom: 14px;
        border-bottom: 1px solid var(--border-subtle);
        font-size: 12px;
      }

      .email-meta-row {
        display: grid;
        grid-template-columns: 52px 1fr;
        gap: 8px;
      }

      .email-meta-label { color: var(--text-muted); }

      .email-meta-value { color: var(--text-primary); word-break: break-word; }

      .email-subject {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 14px;
        color: var(--text-primary);
      }

      .email-body {
        font-size: 14px;
        line-height: 1.65;
        color: var(--text-secondary);
        white-space: pre-line;
      }

      .email-body strong { color: var(--text-primary); font-weight: 600; }

      .email-sent-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 14px;
        padding: 6px 10px;
        border-radius: 6px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 12px;
        font-weight: 500;
      }

      .upload-progress {
        margin-top: 10px;
        height: 4px;
        border-radius: 2px;
        background: var(--border);
        overflow: hidden;
      }

      .upload-progress-bar {
        height: 100%;
        background: var(--accent);
        width: 0%;
        transition: width 0.2s;
      }

      .suggestion-list { display: flex; flex-direction: column; gap: 10px; }

      .suggestion-item {
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--bg-composer);
        cursor: pointer;
        text-align: left;
        font-family: inherit;
        color: inherit;
        width: 100%;
      }

      .suggestion-item:hover { background: var(--bg-hover); }

      .suggestion-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
      .suggestion-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

      .composer-wrap {
        padding: 12px 16px 20px;
        background: linear-gradient(180deg, transparent, var(--bg-main) 20%);
      }

      .composer-inner {
        max-width: 46rem;
        margin: 0 auto;
        display: flex;
        align-items: flex-end;
        gap: 4px;
        padding: 10px 12px;
        border-radius: 24px;
        background: var(--bg-composer);
        border: 1px solid var(--border-subtle);
      }

      .composer-inner:focus-within { border-color: var(--border); }

      .composer-attach {
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
      }

      .composer-attach:hover { background: var(--bg-hover); color: var(--text-primary); }

      .composer-input {
        flex: 1;
        border: none;
        background: transparent;
        color: var(--text-primary);
        font-size: 16px;
        font-family: inherit;
        resize: none;
        outline: none;
        min-height: 24px;
        max-height: 160px;
        line-height: 1.5;
        padding: 6px 4px;
      }

      .composer-input::placeholder { color: var(--text-muted); }

      .composer-send {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: none;
        background: #424242;
        color: #8e8e8e;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
      }

      .composer-send.active { background: #fff; color: #000; }
      .composer-send:disabled { opacity: 0.35; cursor: not-allowed; }

      #fileInput { display: none; }

      @media (max-width: 768px) {
        .app { grid-template-columns: 1fr; }
        .sidebar { display: none; }
      }
    </style>
  </head>
  <body>
    <input type="file" id="fileInput" multiple accept=".pdf,.png,.jpg,.jpeg,.csv,.xlsx,.xls,.doc,.docx" />

    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-top">
          <div class="sidebar-logo">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.055 6.055 0 0 0-.747-7.073zM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.855-5.833-3.387L15.119 7.2a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.407-.667zm2.01-3.023-.141-.085-4.774-2.755a.775.775 0 0 0-.785 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zm-12.64 4.135-2.02-1.168a.08.08 0 0 1-.038-.057V6.075a4.5 4.5 0 0 1 7.375-3.453l-.142.08-4.778 2.758a.795.795 0 0 0-.393.681zm1.097-2.365 2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5z"/>
            </svg>
            ChatGPT
          </div>
          <button class="new-chat" id="newChatBtn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            New chat
          </button>
        </div>
        <div class="chat-history">
          <div class="history-item active" id="chatTitle">New chat</div>
          <div class="history-item">Cash flow for Q2</div>
        </div>
        <div class="sidebar-footer">Interactive iwoca demo</div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div class="model-picker">
            ChatGPT 4o
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
          <div class="topbar-actions">
            <span class="connector-badge hidden" id="connectorBadge">
              <span class="connector-dot"></span>
              iwoca
            </span>
            <button class="demo-btn" id="resetBtn" type="button">Reset</button>
          </div>
        </header>

        <div class="chat-area" id="chatArea">
          <div id="messages"></div>
        </div>

        <div class="composer-wrap">
          <div class="composer-inner">
            <button class="composer-attach" id="attachBtn" type="button" aria-label="Attach files">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <textarea class="composer-input" id="composerInput" rows="1" placeholder="Ask anything"></textarea>
            <button class="composer-send" id="sendBtn" type="button" aria-label="Send" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const messagesEl = document.getElementById("messages");
      const chatArea = document.getElementById("chatArea");
      const composerInput = document.getElementById("composerInput");
      const sendBtn = document.getElementById("sendBtn");
      const attachBtn = document.getElementById("attachBtn");
      const fileInput = document.getElementById("fileInput");
      const resetBtn = document.getElementById("resetBtn");
      const newChatBtn = document.getElementById("newChatBtn");
      const chatTitle = document.getElementById("chatTitle");
      const connectorBadge = document.getElementById("connectorBadge");

      const OPENAI_LOGO = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.055 6.055 0 0 0-.747-7.073z"/></svg>`;

      let busy = false;
      let userInitials = "You";
      let uploadTarget = "composer";

      const app = {
        phase: "discover",
        iwocaConnected: false,
        fields: {
          firstName: null, lastName: null, companyName: null,
          companiesHouseNumber: null,
          amountRequested: null, annualTurnover: null, useOfFunds: null,
          fundsDuration: null, email: null, phone: null,
        },
        companiesHouseConfirmed: false,
        reference: null,
        statusLevel: 0,
        pendingField: null,
        uploadedFiles: [],
        accountManager: null,
        emailSent: false,
      };

      const FIELD_PROMPTS = {
        firstName: "your first name", lastName: "your last name",
        companyName: "your company's registered name, as it appears on Companies House",
        amountRequested: "how much funding you need (in GBP)",
        annualTurnover: "your annual turnover (in GBP)",
        useOfFunds: "what you'll use the funds for",
        fundsDuration: "how long you need the funds (e.g. 6 months, 2 years)",
        email: "your email address", phone: "your phone number",
      };

      const FIELD_ORDER = [
        "firstName", "lastName", "companyName", "amountRequested",
        "annualTurnover", "useOfFunds", "fundsDuration", "email", "phone",
      ];

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function formatGbp(amount) {
        return `£${Number(amount).toLocaleString("en-GB")}`;
      }

      function formatFileSize(bytes) {
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      }

      function parseMoney(text) {
        const match = text.match(/£?\s*([\d,]+(?:\.\d+)?)\s*(k|K|m|M|million)?/);
        if (!match) return null;
        let value = parseFloat(match[1].replace(/,/g, ""));
        const suffix = match[2]?.toLowerCase();
        if (suffix === "k") value *= 1000;
        if (suffix === "m" || suffix === "million") value *= 1_000_000;
        return Number.isFinite(value) ? value : null;
      }

      function assignFieldValue(fieldKey, text) {
        const value = text
          .replace(/^(it'?s|that'?s|about|around|my company is|company is|registered name is|the registered name is|company:?)\s+/i, "")
          .trim().replace(/\.$/, "");
        if (!value || value.length >= 120) return false;

        if (fieldKey === "amountRequested" || fieldKey === "annualTurnover") {
          const money = parseMoney(value);
          if (!money) return false;
          app.fields[fieldKey] = money;
          return true;
        }
        if (fieldKey === "firstName" || fieldKey === "lastName") {
          const parts = value.split(/\s+/).filter(Boolean);
          if (!parts.length) return false;
          if (fieldKey === "firstName") app.fields.firstName = parts[0];
          if (fieldKey === "lastName") app.fields.lastName = parts[parts.length - 1];
          return true;
        }
        if (fieldKey === "email") {
          const email = value.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i);
          app.fields.email = email ? email[0] : value;
          return true;
        }
        if (fieldKey === "phone") {
          const phone = value.match(/(?:\+?\d[\d ()\-]{6,}\d)/);
          app.fields.phone = phone ? phone[0].trim() : value;
          return true;
        }
        if (fieldKey === "companyName") {
          app.companiesHouseConfirmed = false;
          app.fields.companiesHouseNumber = null;
        }
        app.fields[fieldKey] = value;
        return true;
      }

      function extractFields(text) {
        const emailMatch = text.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i);
        if (emailMatch) app.fields.email = emailMatch[0];

        const phoneMatch = text.match(/(?:\+?\d[\d ()\-]{6,}\d)/);
        if (phoneMatch) app.fields.phone = phoneMatch[0].trim();

        const amounts = [];
        const amountRegex = /£?\s*[\d,]+(?:\.\d+)?\s*(?:k|K|m|M|million)?/g;
        let m;
        while ((m = amountRegex.exec(text)) !== null) {
          const parsed = parseMoney(m[0]);
          if (parsed) amounts.push(parsed);
        }

        if (amounts.length >= 1 && !app.fields.amountRequested) app.fields.amountRequested = amounts[0];
        if (amounts.length >= 2 && !app.fields.annualTurnover) app.fields.annualTurnover = amounts[1];
        else if (/turnover|revenue/i.test(text) && amounts.length && !app.fields.annualTurnover)
          app.fields.annualTurnover = amounts[amounts.length - 1];

        const durationMatch = text.match(/(\d+\s*(?:months?|years?|weeks?)|(?:six|twelve|two|three|four|five)\s+(?:months?|years?))/i);
        if (durationMatch && !app.fields.fundsDuration) app.fields.fundsDuration = durationMatch[0];

        const companyMatch = text.match(/(?:company(?:\s+is)?|business(?:\s+is)?|called)\s+(.+?)(?:\.|,|$)/i);
        if (companyMatch && !app.fields.companyName) app.fields.companyName = companyMatch[1].trim();
        else if (/(Ltd|Limited|LLP|PLC)/i.test(text) && !app.fields.companyName) {
          const ltdMatch = text.match(/(.+?(?:Ltd|Limited|LLP|PLC)\.?)/i);
          if (ltdMatch) app.fields.companyName = ltdMatch[1].trim();
        }

        if (/use|for|towards|buy|purchase|fund/i.test(text) && !app.fields.useOfFunds) {
          const useMatch = text.match(/(?:use(?:\s+it)?\s+for|for|towards|buy|purchase)\s+(.+?)(?:\.|,|over|email|phone|$)/i);
          if (useMatch) app.fields.useOfFunds = useMatch[1].trim().replace(/\.$/, "");
          else if (/oven|equipment|stock|cash flow|expansion|hiring/i.test(text))
            app.fields.useOfFunds = text.match(/(?:oven|equipment|stock|cash flow|expansion|hiring)[^.]*/i)?.[0]?.trim();
        }

        const nameMatch = text.match(/(?:i'm|i am|my name is|this is)\s+([A-Z][a-z]+)(?:\s+([A-Z][a-z]+))?/i);
        if (nameMatch) {
          if (!app.fields.firstName) app.fields.firstName = nameMatch[1];
          if (nameMatch[2] && !app.fields.lastName) app.fields.lastName = nameMatch[2];
        }
      }

      function missingFields() {
        return FIELD_ORDER.filter((key) => !app.fields[key]);
      }

      function fullName() {
        return [app.fields.firstName, app.fields.lastName].filter(Boolean).join(" ");

      function isConfirmIntent(text) {

      function renderMessage(data) {

        if (data.widget === "companiesHouse") widgetHtml = companiesHouseWidget();

        if (data.widget === "summary") widgetHtml = summaryWidget();

        const bodyHtml = data.html || `<p>${escapeHtml(data.text).replace(/\n\n/g, "</p><p>").replace(/\n/g, "<br>")}</p>`;

        if (data.role === "user") {

      function refreshWidgets() {
        document.querySelectorAll("[data-widget='submitted'], [data-widget='status']").forEach((widget) => {
          const type = widget.dataset.widget;
          const parent = widget.parentElement;
          const temp = document.createElement("div");
          temp.innerHTML = type === "submitted" ? submittedWidget() : statusWidget();
          parent.replaceChild(temp.firstElementChild, widget);
          bindWidgetActions(parent);
        });
      }

      function bindWidgetActions(root) {
        root.querySelectorAll("[data-action]").forEach((el) => {
          el.addEventListener("click", (e) => {
            const action = el.dataset.action;
            if (action === "upload") { e.stopPropagation(); openFilePicker("widget"); return; }
            if (action === "confirm-ch") handleUserInput("Yes, that's correct.");
            if (action === "reject-ch") handleUserInput("No, that's not my company.");
            if (action === "suggestion-iwoca") handleUserInput("I'd like to apply with iwoca.");
            if (action === "suggestion-bank") handleUserInput("Tell me more about the bank loan option.");
            if (action === "suggestion-startup") handleUserInput("What about Start Up Loans?");
            if (action === "suggestion-compare") handleUserInput("How do comparison sites work?");
            if (action === "submit") handleUserInput("Yes, please submit it.");
            if (action === "edit") handleUserInput("I'd like to edit my details.");
          });
        });

        root.querySelectorAll(".upload-zone").forEach((zone) => {
          zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("dragover"); });
          zone.addEventListener("dragleave", () => zone.classList.remove("dragover"));
          zone.addEventListener("drop", (e) => {
            e.preventDefault();
            zone.classList.remove("dragover");
            if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
          });
        });
      }

      function openFilePicker(source) {
        if (app.phase !== "submitted" && app.statusLevel < 2) {
          if (app.phase === "submitted") {
            app.statusLevel = 2;
            refreshWidgets();
          } else {
            renderMessage({ role: "assistant", text: "You can upload documents once your application has been submitted. Finish the application first, or ask for the status to see if documents are needed." });
            return;
          }
        }
        uploadTarget = source;
        fileInput.click();
      }

      async function handleFiles(fileList) {
        const files = Array.from(fileList);
        if (!files.length) return;

        if (app.phase !== "submitted" && app.statusLevel < 2) {
          renderMessage({ role: "assistant", text: "Documents can be uploaded once your iwoca application is submitted and documents have been requested." });
          return;
        }

        app.statusLevel = Math.max(app.statusLevel, 2);

        const names = files.map((f) => f.name).join(", ");
        renderMessage({ role: "user", text: `Uploaded: ${names}` });

        busy = true;
        showTyping();

        for (let i = 0; i <= 100; i += 20) {
          await delay(120);
        }

        removeTyping();
        files.forEach((f) => {
          app.uploadedFiles.push({ name: f.name, size: f.size });
        });

        refreshWidgets();

        renderMessage({
          role: "assistant",
          tool: "upload_documents",
          text: `Received ${files.length} document${files.length > 1 ? "s" : ""}. I'll send your confirmation email now.`,
          widget: app.phase === "submitted" ? "submitted" : "status",
        });

        showTyping();
        await delay(900);
        removeTyping();

        renderMessage({ role: "assistant", ...sendConfirmationEmail() });
        refreshWidgets();

        busy = false;
        updateSendButton();
      }

      function showTyping() {
        const row = document.createElement("div");

        row.id = "typing-indicator";
        row.innerHTML = `<div class="message-inner">

      function removeTyping() {
        document.getElementById("typing-indicator")?.remove();

      function buildCollectingResponse() {
        if (app.fields.companyName && !app.companiesHouseConfirmed) {
          return startCompaniesHouseConfirm();
        }
        const missing = missingFields();
        if (!missing.length) {
          app.phase = "summary";
          updateUserInitials();
          if (app.fields.companyName) chatTitle.textContent = `${app.fields.companyName} funding`;
          return {
            tool: "apply_for_business_finance",
            text: `Thanks ${app.fields.firstName} — I've put together your application. Please review the summary below and let me know if everything looks right.`,
            widget: "summary",
          };
        }
        const next = missing[0];
        app.pendingField = next;
        if (missing.length === FIELD_ORDER.length) {
          return { text: `Great — I've connected iwoca. We can complete your application right here in chat.\n\nTo begin, could you share ${FIELD_PROMPTS[next]}?` };
        }
        if (missing.length > 1) {
          const prompt = next === "companyName"
            ? "What's your company's registered name, as it appears on Companies House?"
            : `Got it. Could you share ${FIELD_PROMPTS[next]}?`;
          return { text: `${prompt}\n\n(${missing.length - 1} more detail${missing.length > 2 ? "s" : ""} after that.)` };
        }
        if (next === "companyName") {
          return { text: "What's your company's registered name, as it appears on Companies House?" };
        }
        return { text: `Got it. Could you share ${FIELD_PROMPTS[next]}?` };
      }

      function submitApplication() {
        app.reference = `IW-${100040 + Math.floor(Math.random() * 900)}`;
        app.phase = "submitted";
        app.statusLevel = 0;
        return {
          tool: "apply_for_business_finance",
          text: `Done — your application is in. Thanks ${app.fields.firstName}, an iwoca specialist will pick it up shortly. Here's your reference. You can upload supporting documents below when ready.`,

      function checkStatus() {
        if (app.statusLevel < 2) app.statusLevel += 1;
        const statusText = app.statusLevel === 1
          ? "Your application is currently under review. No action needed from you yet — I'll let you know when documents are requested."
          : "Documents are now requested. Upload bank statements and accounts using the upload area below — you can drag files in or click to browse.";
        return { tool: "check_application_status", text: statusText, widget: "status" };
      }

      function processMessage(text) {
        const trimmed = text.trim();
        if (!trimmed) return null;

        if (app.phase === "complete") {
          return {
            text: `Your application is complete. A confirmation email has been sent to ${app.fields.email}, and ${app.accountManager?.name || "your account manager"} will contact you within one working day. Your reference is ${app.reference}.`,
          };
        }

        if (app.phase === "submitted" && isStatusIntent(trimmed)) return checkStatus();

        if (app.phase === "summary") {
          if (isEditIntent(trimmed)) {
            app.phase = "collecting";
            app.pendingField = null;
            return { text: "No problem — tell me what you'd like to change, or share the updated details." };
          }
          if (isConfirmIntent(trimmed)) return submitApplication();
          return { text: 'Please review the summary above. Say "submit" when you\'re happy to proceed, or tell me what to change.' };
        }

        if (app.phase === "submitted") {
          if (/upload|document|statement/i.test(trimmed)) {
            app.statusLevel = Math.max(app.statusLevel, 2);
            return { text: "Use the upload area in your application card — click it or drag files in. PDFs, bank statements, and accounts all work.", widget: "submitted" };
          }
          return { text: `Your reference is ${app.reference}. Ask "what's the status?" to check progress, or upload documents using the card above.` };
        }

        if (app.phase === "discover") {
          if (isIwocaChoice(trimmed)) { connectIwoca(); extractFields(trimmed); return buildCollectingResponse(); }
          if (/bank|high street/i.test(trimmed)) return { text: "High street banks offer secured or unsecured business loans with fixed repayments. You'll usually need 2–3 years of accounts, a business plan, and a good credit history. The process can take several weeks. You apply through your bank's website or branch.", widget: "suggestions" };
          if (/start up|startup/i.test(trimmed)) return { text: "Start Up Loans are government-backed — up to £25,000 per owner, capped at £100,000 per business, with free mentoring. They're aimed at businesses trading less than three years. Applications are made through the Start Up Loans website.", widget: "suggestions" };
          if (/compar|swoop|funding options/i.test(trimmed)) return { text: "Comparison sites let you enter your business details once and see offers from multiple lenders side by side. Useful for shopping around, though you'll still apply on each lender's own site.", widget: "suggestions" };
          if (isFundingIntent(trimmed)) return openingAssistantResponse();
          return { text: "I can walk you through any of the options above — just say which one interests you, or ask for more detail.", widget: "suggestions" };
        }

        if (app.phase === "enterCompaniesHouseNumber") {
          const number = parseCompaniesHouseNumber(trimmed);
          if (!number) {
            return { text: "I need the Companies House number — it's usually 8 digits. You can copy it from your certificate of incorporation or from the Companies House website." };
          }
          app.fields.companiesHouseNumber = number;
          app.fields.companyName = mockCompanyNameFromNumber(number);
          return startCompaniesHouseConfirm(true);
        }

        if (app.phase === "confirmCompaniesHouse") {
          if (isConfirmIntent(trimmed)) {
            app.companiesHouseConfirmed = true;
            app.phase = "collecting";
            app.pendingField = null;
            return buildCollectingResponse();
          }
          if (isRejectIntent(trimmed)) {
            return askForCompaniesHouseNumber();
          }
          return { text: "Please confirm the Companies House details above, or say if it's not your company." };
        }

        if (app.phase === "collecting") {
          extractFields(trimmed);
          if (!app.pendingField) {
            const missing = missingFields();
            if (missing.length) app.pendingField = missing[0];
          }
          if (app.pendingField && !app.fields[app.pendingField]) assignFieldValue(app.pendingField, trimmed);
          const stillMissing = missingFields();
          if (app.pendingField && stillMissing.includes(app.pendingField)) {
            const retry = app.pendingField === "companyName"
              ? "I didn't quite catch that — what's the registered company name on Companies House?"
              : `I didn't quite catch that — could you share ${FIELD_PROMPTS[app.pendingField]}?`;
            return { text: retry };
          }
          if (app.fields.companyName && !app.companiesHouseConfirmed) {
            return startCompaniesHouseConfirm();
          }
          return buildCollectingResponse();
        }

        return { text: "I'm here to help with iwoca business finance. What would you like to do?" };
      }

      async function respondToUser(text) {
        busy = true;
        sendBtn.disabled = true;
        showTyping();
        await delay(600 + Math.random() * 400);
        removeTyping();
        const response = processMessage(text);
        if (response) renderMessage({ role: "assistant", ...response });
        busy = false;
        updateSendButton();
        composerInput.focus();
      }

      async function handleUserInput(text) {
        if (busy || !text.trim()) return;
        const trimmed = text.trim();
        composerInput.value = "";
        autoResizeComposer();
        updateSendButton();
        renderMessage({ role: "user", text: trimmed });
        await respondToUser(trimmed);
      }

      function delay(ms) { return new Promise((r) => setTimeout(r, ms)); }

      function autoResizeComposer() {
        composerInput.style.height = "auto";
        composerInput.style.height = `${Math.min(composerInput.scrollHeight, 160)}px`;
      }

      function updateSendButton() {
        const hasText = composerInput.value.trim().length > 0;
        sendBtn.disabled = !hasText || busy;
        sendBtn.classList.toggle("active", hasText && !busy);
      }

      function resetChat() {
        busy = false;
        userInitials = "You";
        app.phase = "discover";
        app.iwocaConnected = false;
        app.reference = null;
        app.statusLevel = 0;
        app.companiesHouseConfirmed = false;
        app.pendingField = null;
        app.uploadedFiles = [];
        app.accountManager = null;
        app.emailSent = false;
        Object.keys(app.fields).forEach((k) => { app.fields[k] = null; });
        messagesEl.innerHTML = "";
        chatTitle.textContent = "New chat";
        connectorBadge.classList.add("hidden");
        composerInput.value = "";
        fileInput.value = "";
        autoResizeComposer();
        updateSendButton();
        composerInput.focus();
      }

      sendBtn.addEventListener("click", () => handleUserInput(composerInput.value));
      attachBtn.addEventListener("click", () => openFilePicker("composer"));
      fileInput.addEventListener("change", () => {
        if (fileInput.files.length) handleFiles(fileInput.files);
        fileInput.value = "";
      });
      composerInput.addEventListener("input", () => { autoResizeComposer(); updateSendButton(); });
      composerInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!sendBtn.disabled) handleUserInput(composerInput.value); }
      });
      resetBtn.addEventListener("click", resetChat);
      newChatBtn.addEventListener("click", resetChat);

      resetChat();
    </script>
  </body>
</html>
