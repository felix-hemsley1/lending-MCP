<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iwoca Credit Compass (demo)</title>
    <style>
      :root {
        color-scheme: light;
        /* Near-white, very light grey/blue page background */
        --bg: #eef2f9;
        /* Light blue component/card background */
        --card: #e0eafb;
        --card-border: #c6d6f1;
        /* Black body text */
        --fg: #14171d;
        --muted: #454b57;
        /* Faded iwoca-style red for keywords + logo (approximate — swap for
           the exact brand hex when available; site fetch was egress-blocked) */
        --iwoca-red: #c85f57;
        --iwoca-red-soft: rgba(200, 95, 87, 0.14);
        --strong: #2f9e6a;
        --steady: #c98a1a;
        --watch: #c0483b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        padding: 16px;
      }
      .wrap { max-width: 520px; margin: 0 auto; }
      .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      .logo {
        font-size: 24px; font-weight: 800; letter-spacing: -0.01em;
        color: var(--iwoca-red); line-height: 1;
      }
      .brand .tag { font-size: 12px; color: var(--muted); font-weight: 600; }
      .demo-banner {
        background: var(--iwoca-red-soft);
        border: 1px solid var(--iwoca-red);
        color: var(--iwoca-red);
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-align: center;
        margin-bottom: 14px;
      }
      h1 { font-size: 18px; margin: 0 0 2px; color: var(--fg); }
      h1 .kw { color: var(--iwoca-red); }
      .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
      .card {
        background: var(--card); border: 1px solid var(--card-border);
        border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
      }
      .score-row { display: flex; align-items: center; gap: 16px; }
      .score {
        font-size: 40px; font-weight: 800; line-height: 1;
        min-width: 96px; text-align: center; color: var(--iwoca-red);
      }
      .score small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
      .band {
        display: inline-block; padding: 4px 10px; border-radius: 999px;
        background: #fff; border: 1px solid var(--card-border);
        font-size: 13px; font-weight: 700; color: var(--iwoca-red);
      }
      .bar { height: 8px; background: #fff; border-radius: 999px; overflow: hidden; flex: 1; border: 1px solid var(--card-border); }
      .bar > span { display: block; height: 100%; background: var(--iwoca-red); }
      .factors { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
      .factor {
        display: flex; align-items: center; gap: 10px;
        background: var(--card); border: 1px solid var(--card-border);
        border-radius: 10px; padding: 10px 12px;
      }
      .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
      .dot.strong { background: var(--strong); }
      .dot.steady { background: var(--steady); }
      .dot.watch { background: var(--watch); }
      .factor .name { font-weight: 700; font-size: 14px; color: var(--fg); }
      .factor .note { color: var(--muted); font-size: 12px; }
      .factor .sig { margin-left: auto; font-size: 12px; text-transform: capitalize; color: var(--iwoca-red); font-weight: 600; }
      .disclaimer {
        margin-top: 16px; font-size: 11px; color: var(--muted);
        border-top: 1px solid var(--card-border); padding-top: 10px; line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">
        <span class="logo">iwoca</span>
        <span class="tag">Credit Compass</span>
      </div>
      <div class="demo-banner">DEMO — FAKE DATA · NOT A CREDIT DECISION</div>
      <h1 id="title">iwoca <span class="kw">Credit Compass</span></h1>
      <p class="sub" id="subtitle">Fake demo data — a real Credit Compass needs an iwoca scoring API connection (not connected)</p>
      <div class="card">
        <div class="score-row">
          <div class="score"><span id="score">–</span><small>/ 100</small></div>
          <div style="flex:1">
            <div style="margin-bottom:8px"><span class="band" id="band">–</span></div>
            <div class="bar"><span id="bar" style="width:0%"></span></div>
          </div>
        </div>
      </div>
      <ul class="factors" id="factors"></ul>
      <p class="disclaimer" id="disclaimer"></p>
    </div>

    <script>
      // Read the tool's structuredContent from the Apps SDK host, if present.
      // (window.openai is injected by ChatGPT / Apps SDK hosts. This widget
      // degrades gracefully to a placeholder when opened outside such a host.)
      function getData() {
        try {
          if (window.openai && window.openai.toolOutput) return window.openai.toolOutput;
        } catch (e) {}
        return null;
      }

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function render(data) {
        if (!data) return;
        var score = Number(data.score) || 0;
        // textContent escapes on its own — do NOT run esc() here or entities
        // like an apostrophe get double-escaped.
        document.getElementById("score").textContent =
          data.score == null ? "" : String(data.score);
        document.getElementById("band").textContent =
          data.band == null ? "" : String(data.band);
        document.getElementById("bar").style.width =
          Math.max(0, Math.min(100, score)) + "%";
        if (data.business_name) {
          // esc() escapes the business name; the surrounding markup is static.
          document.getElementById("title").innerHTML =
            'iwoca <span class="kw">Credit Compass</span> — ' + esc(data.business_name);
        }
        var factors = Array.isArray(data.factors) ? data.factors : [];
        var list = document.getElementById("factors");
        list.innerHTML = "";
        factors.forEach(function (f) {
          var sig = ["strong", "steady", "watch"].indexOf(f.signal) >= 0 ? f.signal : "steady";
          var li = document.createElement("li");
          li.className = "factor";
          li.innerHTML =
            '<span class="dot ' + sig + '"></span>' +
            '<span><span class="name">' + esc(f.name) + "</span><br>" +
            '<span class="note">' + esc(f.note || "") + "</span></span>" +
            '<span class="sig">' + esc(sig) + "</span>";
          list.appendChild(li);
        });
        document.getElementById("disclaimer").textContent = data.disclaimer || "";
      }

      render(getData());
    </script>
  </body>
</html>
