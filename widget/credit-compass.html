<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iwoca Credit Compass (demo)</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #12203a;
        --muted: #5a6b85;
        --card: #f4f6fb;
        --border: #dde3ee;
        --strong: #1f9d6b;
        --steady: #c98a1a;
        --watch: #c0483b;
        --accent: #2b59ff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1626;
          --fg: #eef2fb;
          --muted: #9aa8c2;
          --card: #172035;
          --border: #26324d;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        padding: 16px;
      }
      .wrap { max-width: 520px; margin: 0 auto; }
      .demo-banner {
        background: repeating-linear-gradient(
          45deg, rgba(43,89,255,0.10), rgba(43,89,255,0.10) 10px,
          rgba(43,89,255,0.18) 10px, rgba(43,89,255,0.18) 20px);
        border: 1px solid var(--accent);
        color: var(--fg);
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-align: center;
        margin-bottom: 14px;
      }
      h1 { font-size: 18px; margin: 0 0 2px; }
      .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
      .score-row { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
      .score {
        font-size: 40px; font-weight: 700; line-height: 1;
        min-width: 96px; text-align: center;
      }
      .score small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
      .band {
        display: inline-block; padding: 4px 10px; border-radius: 999px;
        background: var(--card); border: 1px solid var(--border); font-size: 13px; font-weight: 600;
      }
      .bar { height: 8px; background: var(--card); border-radius: 999px; overflow: hidden; flex: 1; }
      .bar > span { display: block; height: 100%; background: var(--accent); }
      .factors { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
      .factor {
        display: flex; align-items: center; gap: 10px;
        background: var(--card); border: 1px solid var(--border);
        border-radius: 10px; padding: 10px 12px;
      }
      .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
      .dot.strong { background: var(--strong); }
      .dot.steady { background: var(--steady); }
      .dot.watch { background: var(--watch); }
      .factor .name { font-weight: 600; font-size: 14px; }
      .factor .note { color: var(--muted); font-size: 12px; }
      .factor .sig { margin-left: auto; font-size: 12px; text-transform: capitalize; color: var(--muted); }
      .disclaimer {
        margin-top: 16px; font-size: 11px; color: var(--muted);
        border-top: 1px solid var(--border); padding-top: 10px; line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="demo-banner">DEMO — FAKE DATA · NOT A CREDIT DECISION</div>
      <h1 id="title">iwoca Credit Compass</h1>
      <p class="sub" id="subtitle">Fake demo data — a real Credit Compass needs an iwoca scoring API connection (not connected)</p>
      <div class="score-row">
        <div class="score"><span id="score">–</span><small>/ 100</small></div>
        <div style="flex:1">
          <div style="margin-bottom:8px"><span class="band" id="band">–</span></div>
          <div class="bar"><span id="bar" style="width:0%"></span></div>
        </div>
      </div>
      <ul class="factors" id="factors"></ul>
      <p class="disclaimer" id="disclaimer"></p>
    </div>

    <script>
      // Read the tool's structuredContent from the Apps SDK host, if present.
      // (window.openai is injected by ChatGPT / Apps SDK hosts. This widget
      // degrades gracefully to a placeholder when opened outside such a host.)
      function getData() {
        try {
          if (window.openai && window.openai.toolOutput) return window.openai.toolOutput;
        } catch (e) {}
        return null;
      }

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function render(data) {
        if (!data) return;
        var score = Number(data.score) || 0;
        document.getElementById("score").textContent = esc(data.score);
        document.getElementById("band").textContent = esc(data.band);
        document.getElementById("bar").style.width =
          Math.max(0, Math.min(100, score)) + "%";
        if (data.business_name) {
          document.getElementById("title").textContent =
            "iwoca Credit Compass — " + esc(data.business_name);
        }
        var factors = Array.isArray(data.factors) ? data.factors : [];
        var list = document.getElementById("factors");
        list.innerHTML = "";
        factors.forEach(function (f) {
          var sig = ["strong", "steady", "watch"].indexOf(f.signal) >= 0 ? f.signal : "steady";
          var li = document.createElement("li");
          li.className = "factor";
          li.innerHTML =
            '<span class="dot ' + sig + '"></span>' +
            '<span><span class="name">' + esc(f.name) + "</span><br>" +
            '<span class="note">' + esc(f.note || "") + "</span></span>" +
            '<span class="sig">' + esc(sig) + "</span>";
          list.appendChild(li);
        });
        document.getElementById("disclaimer").textContent = esc(data.disclaimer || "");
      }

      render(getData());
    </script>
  </body>
</html>
